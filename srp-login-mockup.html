<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンクロニシティシステムズ - ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #2C5282;
    --brand-light: #5B7FA8;
    --brand-dark: #1F4E79;
    --brand-bg: #E2E8F0;
    --accent: #D97706;
    --bg: #FAFAF9;
    --card: #EEF0F2;
    --surface: #EEF0F2;
    --text: #1C1917;
    --text-soft: #57534E;
    --text-mute: #78716C;
    --border: #E7E5E4;
    --border-soft: #F5F5F4;
    --success: #7BA428;
    --warning: #D97706;
    --error: #B91C1C;
    --shadow: 0 1px 3px rgba(28,25,23,.08);
    --shadow-card: 0 2px 8px rgba(28,25,23,.08), 0 1px 3px rgba(28,25,23,.05);
    --focus-ring: 0 0 0 3px rgba(44,82,130,.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Inter Tight", "Noto Sans JP", sans-serif;
    background: #D3DEE9;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* レイアウト */
  .auth-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  /* 上部ロゴ＋プロダクト名 */
  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .auth-brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(28,25,23,.10);
  }
  .auth-brand-text {
    text-align: center;
  }
  .auth-brand-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--brand-dark);
    letter-spacing: -0.005em;
    line-height: 1.2;
  }
  .auth-brand-sub {
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: 0.18em;
    font-weight: 600;
    margin-top: 4px;
  }

  /* カード */
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 32px 28px;
  }
  .auth-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 6px;
  }
  .auth-lead {
    font-size: 13px;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 24px;
  }

  /* ソーシャルログイン */
  .social-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .social-btn:hover {
    border-color: var(--brand-light);
    background: var(--bg);
    transform: translateY(-1px);
  }
  .social-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* 区切り線 */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-mute);
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* フォーム */
  .form-field {
    margin-bottom: 16px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-label .required {
    color: var(--error);
    margin-left: 2px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    transition: all 0.15s;
  }
  .form-input::placeholder { color: var(--text-mute); }
  .form-input:hover { border-color: var(--brand-light); }
  .form-input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: var(--focus-ring);
  }
  .form-help {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-mute);
  }

  .password-wrap {
    position: relative;
  }
  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-mute);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    font-size: 12px;
    transition: all 0.15s;
  }
  .password-toggle:hover { color: var(--brand-dark); background: var(--bg); }

  /* 補助行 */
  .form-row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 18px;
    font-size: 12px;
  }
  .checkbox-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-soft);
    cursor: pointer;
    user-select: none;
  }
  .checkbox-wrap input[type=checkbox] {
    width: 14px; height: 14px;
    accent-color: var(--brand);
  }
  .link-soft {
    color: var(--brand-dark);
    text-decoration: none;
    font-weight: 600;
  }
  .link-soft:hover { text-decoration: underline; }

  /* プライマリボタン */
  .btn-primary {
    width: 100%;
    padding: 12px 16px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .btn-primary:hover:not(.is-loading) {
    background: var(--brand-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(44,82,130,.25);
  }
  .btn-primary.is-loading {
    cursor: wait;
    background: var(--brand-dark);
  }
  .btn-primary:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  /* ローディングスピナー */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-primary.is-loading .spinner { display: inline-block; }
  .btn-primary.is-loading .btn-label-default { display: none; }
  .btn-primary .btn-label-loading { display: none; }
  .btn-primary.is-loading .btn-label-loading { display: inline; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ローディング時のシマー（白のみ） */
  .btn-primary.is-loading::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.18) 50%,
      transparent 100%);
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  /* 切り替えリンク（下部） */
  .auth-switch {
    margin-top: 22px;
    text-align: center;
    font-size: 13px;
    color: var(--text-soft);
  }
  .auth-switch a {
    color: var(--brand-dark);
    text-decoration: none;
    font-weight: 700;
    margin-left: 4px;
  }
  .auth-switch a:hover { text-decoration: underline; }

  /* 「AIに聞く」軽いCTA */
  .ai-help {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
    transition: color 0.15s;
  }
  .ai-help:hover { color: var(--brand-dark); }
  .ai-help-icon {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  /* フッター */
  .auth-foot {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: var(--text-mute);
    line-height: 1.7;
  }
  .auth-foot a {
    color: var(--text-soft);
    text-decoration: none;
    margin: 0 6px;
  }
  .auth-foot a:hover { text-decoration: underline; }

  /* レスポンシブ */
  @media (max-width: 480px) {
    .auth-card { padding: 24px 20px; }
    .auth-brand-name { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="auth-shell">

  <!-- ロゴ＋プロダクト名 -->
  <div class="auth-brand">
    <div class="auth-brand-mark">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-label="シンクロニシティシステムズ">
        <defs>
          <linearGradient id="logoGradLogin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <line x1="18" y1="6"  x2="6"  y2="22" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="18" y1="6"  x2="30" y2="22" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="6"  y1="22" x2="18" y2="30" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="30" y1="22" x2="18" y2="30" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="6"  y1="22" x2="30" y2="22" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="18" y1="6"  x2="18" y2="30" stroke="url(#logoGradLogin)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        <circle cx="18" cy="6"  r="3" fill="url(#logoGradLogin)"/>
        <circle cx="6"  cy="22" r="3" fill="url(#logoGradLogin)"/>
        <circle cx="30" cy="22" r="3" fill="url(#logoGradLogin)"/>
        <circle cx="18" cy="30" r="3" fill="url(#logoGradLogin)"/>
      </svg>
    </div>
    <div class="auth-brand-text">
      <div class="auth-brand-name">シンクロニシティシステムズ</div>
      <div class="auth-brand-sub">SYNCHRONICITY SYSTEMS</div>
    </div>
  </div>

  <!-- ログインカード -->
  <div class="auth-card" role="main" aria-labelledby="loginTitle">
    <h1 class="auth-title" id="loginTitle">おかえりなさい</h1>
    <p class="auth-lead">ログインして、続きから始めましょう。</p>

    <!-- ソーシャルログイン -->
    <div class="social-group">
      <button type="button" class="social-btn" onclick="alert('Googleでログイン（モック）')">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.13-.84 2.08-1.79 2.72v2.26h2.9c1.7-1.57 2.69-3.88 2.69-6.63z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.9-2.26c-.81.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.71A5.41 5.41 0 0 1 3.65 9c0-.59.1-1.17.3-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Googleでログイン
      </button>
      <button type="button" class="social-btn" onclick="alert('GitHubでログイン（モック）')">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#181717" d="M9 0a9 9 0 0 0-2.85 17.54c.45.08.62-.2.62-.43v-1.49c-2.5.55-3.03-1.21-3.03-1.21-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.81 1.38 2.12.98 2.63.75.08-.59.31-.98.57-1.21-2-.23-4.1-1-4.1-4.44 0-.98.35-1.78.93-2.41-.1-.23-.4-1.15.09-2.4 0 0 .76-.24 2.48.92a8.6 8.6 0 0 1 4.51 0c1.72-1.16 2.48-.92 2.48-.92.49 1.25.18 2.17.09 2.4.58.63.93 1.43.93 2.41 0 3.45-2.1 4.21-4.1 4.43.32.28.61.83.61 1.66v2.46c0 .24.16.52.62.43A9 9 0 0 0 9 0z"/>
        </svg>
        GitHubでログイン
      </button>
    </div>

    <div class="divider">または</div>

    <!-- メール／パスワード -->
    <form onsubmit="handleSubmit(event)" autocomplete="on">
      <div class="form-field">
        <label class="form-label" for="emailField">メールアドレス<span class="required">*</span></label>
        <input class="form-input" type="email" id="emailField" name="email"
               placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-field">
        <label class="form-label" for="passwordField">パスワード<span class="required">*</span></label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="passwordField" name="password"
                 placeholder="8文字以上" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="togglePw('passwordField', this)" aria-label="パスワード表示切替">表示</button>
        </div>
      </div>

      <div class="form-row-between">
        <label class="checkbox-wrap">
          <input type="checkbox" checked>
          <span>ログイン状態を保つ</span>
        </label>
        <a class="link-soft" href="#" onclick="alert('パスワード再設定メールを送ります（モック）'); return false;">パスワードをお忘れですか？</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label-default">ログインする</span>
        <span class="btn-label-loading">ログイン中…</span>
      </button>
    </form>

    <!-- 切り替えリンク -->
    <div class="auth-switch">
      はじめての方は<a href="srp-signup-mockup.html">新しく登録</a>
    </div>

    <!-- AIアシスタント -->
    <div class="ai-help" onclick="alert('AIアシスタントに聞きます（モック）')">
      <span class="ai-help-icon" aria-hidden="true">🤖</span>
      <span>うまくログインできない時はAIに聞く</span>
    </div>
  </div>

  <!-- フッター -->
  <div class="auth-foot">
    <div>© 2026 シンクロニシティシステムズ</div>
    <div style="margin-top:4px;">
      <a href="#" onclick="return false;">利用規約</a>・
      <a href="#" onclick="return false;">プライバシーポリシー</a>・
      <a href="#" onclick="return false;">ヘルプ</a>
    </div>
  </div>

</div>

<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') { el.type = 'text'; btn.textContent = '隠す'; }
    else { el.type = 'password'; btn.textContent = '表示'; }
  }

  function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.classList.add('is-loading');
    btn.disabled = true;
    // 演出用：1.6秒後に解除（実装時はAPI完了で）
    setTimeout(() => {
      btn.classList.remove('is-loading');
      btn.disabled = false;
      alert('ログインに成功しました（モック）');
    }, 1600);
  }
</script>

</body>
</html>
